<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Browse data analysts</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F6F3}
a{color:#0E5C45}a:hover{color:#093F30}
button,a{transition:transform 160ms cubic-bezier(0.23,1,0.32,1)}
button:active:not(:disabled){transform:scale(0.97)}
a:active{transform:scale(0.98)}
@media (prefers-reduced-motion: reduce){button,a{transition:none}}
</style>
</helmet>
<div style="min-height: 100vh; background: #F6F6F3; color: #141414; font-family: 'Instrument Sans', sans-serif; font-size: 15px; line-height: 1.5">
  <header style="border-bottom: 1px solid #E3E3DE; background: #FFFFFF">
    <div style="max-width: 1120px; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 24px">
      <a href="Main.dc.html" style="font-weight: 700; font-size: 20px; letter-spacing: -0.02em; color: #141414; text-decoration: none"><span role="img" aria-label="tafutakazi">tafutak<span style="color: #0E5C45">a</span>z<span style="position: relative; display: inline-block; line-height: 1">ı<span aria-hidden="true" style="position: absolute; left: 50%; top: 0.1em; width: 0.165em; height: 0.165em; margin-left: -0.0825em; background: #0E5C45"></span></span><span style="color: #0E5C45">.</span></span></a>
      <nav style="display: flex; gap: 20px; flex: 1 1 auto; flex-wrap: wrap">
        <a href="Main.dc.html" style="color: #141414; text-decoration: none; font-weight: 600">Browse</a>
        <a href="MyTasks.dc.html" style="color: #5C5C57; text-decoration: none">My tasks</a>
      </nav>
      <span style="color: #5C5C57; font-size: 14px">Kamau &amp; Co. Logistics</span>
    </div>
  </header>

  <main style="max-width: 1120px; margin: 0 auto; padding: 48px 24px 64px; display: flex; flex-direction: column; gap: 32px">
    <div style="display: flex; flex-direction: column; gap: 16px">
      <h1 style="margin: 0; font-size: 34px; font-weight: 600; letter-spacing: -0.02em">Who are you hiring?</h1>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{roles}}" as="r" hint-placeholder-count="5">
          <sc-if value="{{r.on}}" hint-placeholder-val="{{ false }}">
            <button onClick="{{r.pick}}" aria-pressed="true" style="font: inherit; font-size: 14px; padding: 10px 16px; min-height: 44px; border-radius: 999px; border: 1px solid #141414; background: #141414; color: #FFFFFF; cursor: pointer">{{r.label}}</button>
          </sc-if>
          <sc-if value="{{r.off}}" hint-placeholder-val="{{ true }}">
            <button onClick="{{r.pick}}" aria-pressed="false" style="font: inherit; font-size: 14px; padding: 10px 16px; min-height: 44px; border-radius: 999px; border: 1px solid #D6D6D0; background: #FFFFFF; color: #141414; cursor: pointer">{{r.label}}</button>
          </sc-if>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 12px; border-bottom: 1px solid #E3E3DE; padding-bottom: 12px">
      <span style="color: #5C5C57">{{countLine}}</span>
      <label style="color: #5C5C57; font-size: 14px; display: flex; gap: 8px; align-items: center">Sort
        <select style="font: inherit; padding: 6px 10px; border: 1px solid #D6D6D0; border-radius: 6px; background: #FFFFFF; color: #141414">
          <option>Recommended</option>
          <option>Most thumbs up</option>
          <option>Newest work</option>
        </select>
      </label>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <sc-for list="{{grads}}" as="g" hint-placeholder-count="4">
        <a href="Profile.dc.html" style="display: flex; flex-wrap: wrap; gap: 24px; align-items: center; padding: 20px; background: #FFFFFF; border: 1px solid #E3E3DE; border-radius: 10px; text-decoration: none; color: #141414">
          <div style="width: 168px; height: 100px; border-radius: 6px; background: #EEF1EE; display: flex; align-items: flex-end; gap: 8px; padding: 14px 18px; box-sizing: border-box; flex: 0 0 auto">
            <div style="width: 18px; height: 30%; background: #A9C2B7; border-radius: 2px"></div>
            <div style="width: 18px; height: 70%; background: #0E5C45; border-radius: 2px"></div>
            <div style="width: 18px; height: 50%; background: #A9C2B7; border-radius: 2px"></div>
            <div style="width: 18px; height: 85%; background: #0E5C45; border-radius: 2px"></div>
            <div style="width: 18px; height: 40%; background: #A9C2B7; border-radius: 2px"></div>
          </div>
          <div style="flex: 999 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 4px">
            <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline">
              <span style="font-size: 18px; font-weight: 600">{{g.name}}</span>
              <sc-if value="{{g.isNew}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #0E5C45; background: #E6EFEB; padding: 2px 8px; border-radius: 999px">New work</span></sc-if>
              <span style="color: #5C5C57; font-size: 14px">{{g.school}}</span>
            </div>
            <span style="color: #2E2E2B">{{g.task}}</span>
            <span style="color: #5C5C57; font-size: 14px">{{g.verdict}}</span>
          </div>
          <div style="display: flex; gap: 20px; color: #5C5C57; font-size: 14px; flex: 0 0 auto">
            <span>{{g.views}} views</span>
            <span style="display: flex; gap: 6px; align-items: center">
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v11H4V10h3zm0 0 4-8a2 2 0 0 1 3 2l-1 5h6a2 2 0 0 1 2 2.3l-1.4 8A2 2 0 0 1 17.6 21H7"></path></svg>
              {{g.ups}}
            </span>
          </div>
        </a>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1060}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { role: 'Data Analyst' };
  }
  renderVals() {
    const names = ['Data Analyst', 'Graphic Designer', 'Digital Marketer', 'Accountant', 'Software Developer'];
    const roles = names.map((n) => ({ label: n, on: this.state.role === n, off: this.state.role !== n, pick: () => this.setState({ role: n }) }));
    return {
      roles,
      countLine: '24 ' + this.state.role.toLowerCase() + 's with finished work',
      grads: [
        { name: 'Kevin Mutua', school: 'IT · KCA 2025', task: 'Logistics delivery times dashboard · 1 task done', verdict: 'Good SQL. First task, promising start.', views: 2, ups: 0, isNew: true },
        { name: 'Wanjiru Kamau', school: 'Statistics · JKUAT 2026', task: 'Grocery chain sales dashboard · 3 tasks done', verdict: 'Clean, accurate data work. Explains decisions clearly.', views: 14, ups: 6, isNew: false },
        { name: 'Faith Chebet', school: 'Actuarial Science · Moi 2026', task: 'Clinic appointments report · 2 tasks done', verdict: 'Careful with messy data. Charts need tidier labels.', views: 3, ups: 1, isNew: true },
        { name: 'Brian Otieno', school: 'Economics · UoN 2025', task: 'SACCO loan defaults analysis · 2 tasks done', verdict: 'Strong Excel and Power BI. Write-up could be shorter.', views: 11, ups: 5, isNew: false }
      ]
    };
  }
}
</script>
</body>
</html>
